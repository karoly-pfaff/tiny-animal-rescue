name: merge validated epic

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Canonical epic pull-request number
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write

jobs:
  squash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: node scripts/merge-epic.mjs --pull-request ${{ inputs.pull_request }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
