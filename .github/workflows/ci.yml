name: required-quality

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  merge_group:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '17 4 * * 1'

concurrency:
  group: required-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run validate:repository
      - run: npm run test:governance

  history:
    if: github.event_name != 'schedule'
    needs: supply-chain
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/download-artifact@v8
        with:
          name: supply-chain-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports
      - if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        id: tag-qualification
        run: node scripts/resolve-tag-qualification.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.tag-qualification.outputs.artifact_name }}
          path: build/tag-qualification
          github-token: ${{ github.token }}
          run-id: ${{ steps.tag-qualification.outputs.run_id }}
      - run: node scripts/run-ci-history.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: history-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/history
          if-no-files-found: error

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm test
      - uses: actions/upload-artifact@v7
        with:
          name: tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/coverage
          if-no-files-found: error
      - run: npm run test:content
      - run: npm run test:assets
      - run: npm run test:voice-prompts
      - run: npm run test:a11y

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:preview
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build
            playwright-report
            test-results
          if-no-files-found: error

  visual:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:visual
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/playwright
          if-no-files-found: error

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm run audit:dependencies
      - run: npm run audit:licenses
      - run: npm run test:assets
      - run: npm run build
      - run: npm run sbom
      - run: npm run test:artifact
      - uses: actions/upload-artifact@v7
        with:
          name: supply-chain-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports
          if-no-files-found: error

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          config-file: .github/codeql-config.yml
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm run scan:secrets
      - run: npm run scan:static
      - run: npm run build
      - run: npm run scan:watermarks
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
