name: publish validated milestone tag

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Merged canonical release work-item pull-request number
        required: true
        type: number
      inspection_comment:
        description: Provider comment ID containing the exact-head live inspection record
        required: false
        type: number
      approval_comment:
        description: Repository-owner comment ID explicitly approving this exact tag
        required: true
        type: number
      qualification_run:
        description: Trusted media-qualification workflow run ID cited by the inspection
        required: false
        type: number

permissions:
  actions: read
  checks: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: release-tag-publication
  cancel-in-progress: false
  queue: max

jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      squash_sha: ${{ steps.target.outputs.squash_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: policy
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: policy/.node-version
          cache: npm
          cache-dependency-path: policy/package-lock.json
      - run: npm install --global npm@11.16.0
      - run: npm ci --ignore-scripts
        working-directory: policy
      - id: target
        run: node scripts/resolve-tag-target.mjs --pull-request ${{ inputs.pull_request }}
        working-directory: policy
        env:
          GITHUB_TOKEN: ${{ github.token }}

  build:
    if: github.ref == 'refs/heads/main'
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - if: inputs.inspection_comment == 0
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: candidate
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.squash_sha }}
      - if: inputs.inspection_comment == 0
        uses: actions/setup-node@v7
        with:
          node-version-file: candidate/.node-version
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - if: inputs.inspection_comment == 0
        run: npm install --global npm@11.16.0
      - if: inputs.inspection_comment == 0
        run: npm ci --ignore-scripts
        working-directory: candidate
      - if: inputs.inspection_comment == 0
        run: npm run build
        working-directory: candidate
      - if: inputs.inspection_comment == 0
        run: npm run test:artifact
        working-directory: candidate
      - if: inputs.inspection_comment == 0
        uses: actions/upload-artifact@v7
        with:
          name: tag-candidate-product-${{ github.run_id }}
          path: candidate/build/app
          retention-days: 1
          if-no-files-found: error

  validate:
    if: github.ref == 'refs/heads/main'
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: policy
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: candidate
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.squash_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: policy/.node-version
          cache: npm
          cache-dependency-path: policy/package-lock.json
      - run: npm install --global npm@11.16.0
      - run: npm ci --ignore-scripts
        working-directory: policy
      - if: inputs.inspection_comment == 0
        uses: actions/download-artifact@v8
        with:
          name: tag-candidate-product-${{ github.run_id }}
          path: candidate-product/build/app
      - if: inputs.inspection_comment != 0
        uses: actions/download-artifact@v8
        with:
          pattern: media-qualified-*
          path: policy/qualified-media
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ inputs.qualification_run }}
      - if: inputs.inspection_comment == 0
        run: >-
          node scripts/prepare-merge-evidence.mjs
          --candidate ../candidate
          --artifact ../candidate-product
          --output build/release-evidence.json
        working-directory: policy
      - name: verify trusted checkouts remained clean
        shell: bash
        run: |
          set -euo pipefail
          git -C policy diff --quiet
          git -C policy diff --cached --quiet
          git -C candidate diff --quiet
          git -C candidate diff --cached --quiet
      - run: >-
          node scripts/publish-tag.mjs
          --pull-request ${{ inputs.pull_request }}
          --inspection-comment ${{ inputs.inspection_comment }}
          --approval-comment ${{ inputs.approval_comment }}
          --qualification-run ${{ inputs.qualification_run }}
          --qualification qualified-media
          --candidate ../candidate
          --evidence build/release-evidence.json
        working-directory: policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        with:
          name: approved-release-tag-${{ github.run_id }}
          path: policy/build/release-tag
          retention-days: 1
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: release-tag-publication
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: approved-release-tag-${{ github.run_id }}
          path: ${{ runner.temp }}/release-tag
      - id: target
        name: read validated tag target
        shell: bash
        run: |
          set -euo pipefail
          tag_sha="$(tr -d '\r\n' < "${RUNNER_TEMP}/release-tag/tag-sha.txt")"
          [[ "$tag_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$tag_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.target.outputs.sha }}
          ssh-key: ${{ secrets.RELEASE_TAG_DEPLOY_KEY }}
      - name: publish immutable annotated tag
        shell: bash
        run: |
          set -euo pipefail
          tag_name="$(tr -d '\r\n' < "${RUNNER_TEMP}/release-tag/tag-name.txt")"
          tag_sha="$(tr -d '\r\n' < "${RUNNER_TEMP}/release-tag/tag-sha.txt")"
          policy_sha="$(tr -d '\r\n' < "${RUNNER_TEMP}/release-tag/policy-sha.txt")"
          predecessor_tag="$(tr -d '\r\n' < "${RUNNER_TEMP}/release-tag/predecessor-tag.txt")"
          tag_history_digest="$(tr -d '\r\n' < "${RUNNER_TEMP}/release-tag/tag-history-digest.txt")"
          [[ "$tag_name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[1-9][0-9]*)?$ ]]
          [[ "$tag_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$policy_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$predecessor_tag" = "none" || "$predecessor_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[1-9][0-9]*)?$ ]]
          [[ "$tag_history_digest" =~ ^[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$tag_sha"
          remote_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_main_sha" = "$policy_sha"
          current_tag_history_digest="$(git ls-remote --refs --tags origin 'refs/tags/v*' | sort | sha256sum | awk '{print $1}')"
          test "$current_tag_history_digest" = "$tag_history_digest"
          if [[ "$predecessor_tag" = "none" ]]; then
            test -z "$(git ls-remote --refs --tags origin 'refs/tags/v*')"
          else
            test -n "$(git ls-remote --refs --tags origin "refs/tags/$predecessor_tag")"
          fi
          test -z "$(git ls-remote --refs --tags origin "refs/tags/$tag_name")"
          git config user.name tiny-rescue-release-publisher
          git config user.email tiny-rescue-release-publisher@users.noreply.github.com
          git tag --annotate "$tag_name" --file "${RUNNER_TEMP}/release-tag/tag-message.txt" "$tag_sha"
          git push --force-with-lease="refs/tags/$tag_name:" origin "refs/tags/$tag_name"
